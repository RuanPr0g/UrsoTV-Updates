name: Sync Urso TV OTA APK

on:
  push:
    paths:
      - "sync-ota.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OTA repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and verify signed 0.9.25 APK artifact
        shell: bash
        env:
          EXPECTED_SHA256: 7d864835ef129be38dd92ea00aaead11a27df0c757cfafbec7a46bcce6a155d0
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-4c88-820e-bc9b-62da86ee0b61/raw?se=2026-11-02T06%3A08%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=cb8d3607-cbdf-5c27-b0a4-a1e7af2b49cb&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T23%3A51%3A12Z&ske=2026-11-02T23%3A51%3A12Z&sks=b&skv=2026-02-06&sig=SbR35ptAMkwX%2BB9O1nyMqLUAJofQfao0ZEgXDvbQUuM%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-all-errors \
            --output artifact.zip "$ARTIFACT_URL"
          unzip -p artifact.zip urso-tv.apk > urso-tv-v0.9.25.apk
          test -s urso-tv-v0.9.25.apk
          printf '%s  %s\n' "$EXPECTED_SHA256" "urso-tv-v0.9.25.apk" | sha256sum --check -

      - name: Publish APK to public OTA repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urso-tv-v0.9.25.apk
          if git diff --cached --quiet; then
            echo "APK already synchronized."
            exit 0
          fi
          git commit -m "Publish Urso TV 0.9.25 OTA APK"
          git push origin HEAD:main
